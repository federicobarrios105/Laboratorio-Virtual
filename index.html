<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio Virtual: Área de la Base, Altura y Volumen</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: radial-gradient(circle at center, #1e293b, #0f172a); 
            color: #f8fafc;
            text-align: center; 
            margin: 0;
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            background: rgba(30, 41, 59, 0.85); 
            backdrop-filter: blur(12px);
            border: 2px solid rgba(56, 189, 248, 0.3);
            padding: 35px; 
            border-radius: 20px; 
            width: 100%;
            max-width: 850px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
        }
        h1 { color: #38bdf8; font-size: 28px; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        p { color: #94a3b8; font-size: 16px; margin-bottom: 25px; }
        
        .panel-control {
            background: rgba(15, 23, 42, 0.8);
            padding: 18px 25px;
            border-radius: 14px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        button { 
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); 
            color: white; 
            border: none; 
            padding: 14px 28px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 10px; 
            cursor: pointer; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        button:hover { background: linear-gradient(135deg, #2563eb, #1e40af); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6); }
        .btn-reset { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .btn-reset:hover { background: linear-gradient(135deg, #dc2626, #991b1b); }
        
        .jarra-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .jarra-container {
            font-size: 45px;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        .vertiendo {
            transform: rotate(-45deg) scale(1.1);
        }

        .recipientes-grid { 
            display: flex; 
            justify-content: space-around; 
            align-items: flex-end;
            height: 360px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 25px 15px 15px 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .columna {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Estilo 3D realista para los vasos de laboratorio */
        .recipiente { 
            height: 250px; 
            border: 4px solid rgba(255, 255, 255, 0.4); 
            border-top: none; 
            position: relative; 
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.03) 100%); 
            display: flex; 
            align-items: flex-end; 
            border-radius: 0 0 16px 16px; 
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.1), 0 10px 20px rgba(0,0,0,0.4);
        }
        /* Efecto de brillo lateral tipo vidrio */
        .recipiente::after {
            content: '';
            position: absolute;
            top: 0;
            left: 6px;
            width: 4px;
            height: 100%;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
        }

        .agua { 
            width: 100%; 
            background: linear-gradient(to top, rgba(2, 132, 199, 0.85), rgba(56, 189, 248, 0.9)); 
            height: 0px; 
            transition: height 0.9s cubic-bezier(0.25, 1, 0.5, 1); 
            border-radius: 0 0 12px 12px; 
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.4);
            position: relative;
        }
        /* Onda o brillo superior del agua */
        .agua::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
        }

        .info { 
            font-size: 14px; 
            margin-top: 15px; 
            line-height: 1.5;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.7);
            padding: 8px 12px;
            border-radius: 8px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .info span { color: #38bdf8; font-weight: bold; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Laboratorio Virtual de Cuerpos y Líquidos</h1>
    <p>Ejercicio 12: Viertan el mismo volumen de líquido (1000 cm³) en recipientes con diferente área de base.</p>

    <div class="panel-control">
        <div class="jarra-box">
            <div id="jarra" class="jarra-container">🏺</div>
            <div style="text-align: left; font-size: 14px; font-weight: bold;">Jarra Medidora<br><span style="color: #38bdf8; font-size: 16px;" id="volumenTexto">1000 cm³</span></div>
        </div>
        <div>
            <button onclick="verterLiquido()">Verter Líquido</button>
            <button class="btn-reset" onclick="reiniciar()">Vaciar Recipientes</button>
        </div>
    </div>

    <div class="recipientes-grid">
        <!-- Recipiente 1 -->
        <div class="columna">
            <div class="recipiente" style="width: 110px;">
                <div id="agua1" class="agua"></div>
            </div>
            <div class="info">
                <strong>Base Chica</strong><br>
                Área: 25 cm²<br>
                <span id="alt1">Altura: 0.0 cm</span>
            </div>
        </div>

        <!-- Recipiente 2 -->
        <div class="columna">
            <div class="recipiente" style="width: 150px;">
                <div id="agua2" class="agua"></div>
            </div>
            <div class="info">
                <strong>Base Mediana</strong><br>
                Área: 50 cm²<br>
                <span id="alt2">Altura: 0.0 cm</span>
            </div>
        </div>

        <!-- Recipiente 3 -->
        <div class="columna">
            <div class="recipiente" style="width: 200px;">
                <div id="agua3" class="agua"></div>
            </div>
            <div class="info">
                <strong>Base Grande</strong><br>
                Área: 100 cm²<br>
                <span id="alt3">Altura: 0.0 cm</span>
            </div>
        </div>
    </div>
</div>

<script>
function verterLiquido() {
    let volumen = 1000; // cm3
    
    // Animación de la jarra
    let jarra = document.getElementById('jarra');
    jarra.classList.add('vertiendo');
    setTimeout(() => { jarra.classList.remove('vertiendo'); }, 800);

    // Altura proporcional con mejor escala visual para los vasos grandes
    let h1 = (volumen / 25) * 1.35; 
    let h2 = (volumen / 50) * 1.35; 
    let h3 = (volumen / 100) * 1.35;

    document.getElementById('agua1').style.height = h1 + 'px';
    document.getElementById('alt1').innerText = 'Altura: ' + (volumen / 25).toFixed(1) + ' cm';

    document.getElementById('agua2').style.height = h2 + 'px';
    document.getElementById('alt2').innerText = 'Altura: ' + (volumen / 50).toFixed(1) + ' cm';

    document.getElementById('agua3').style.height = h3 + 'px';
    document.getElementById('alt3').innerText = 'Altura: ' + (volumen / 100).toFixed(1) + ' cm';
}

function reiniciar() {
    document.getElementById('agua1').style.height = '0px';
    document.getElementById('alt1').innerText = 'Altura: 0.0 cm';

    document.getElementById('agua2').style.height = '0px';
    document.getElementById('alt2').innerText = 'Altura: 0.0 cm';

    document.getElementById('agua3').style.height = '0px';
    document.getElementById('alt3').innerText = 'Altura: 0.0 cm';
}
</script>

</body>
</html>
